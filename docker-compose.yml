services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: spaceship_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spaceship
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spaceship"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
